<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ settings.shop_title if settings else '卡密商城' }}{% endblock %}</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/">
        <span class="logo">卡</span>
        <span>{{ settings.shop_title if settings else '卡密商城' }}</span>
      </a>
      <nav class="nav-links">
        <a href="/">商城</a>
        <a href="/orders">订单查询</a>
        <a href="/support">联系客服</a>
        <a href="/admin/">管理后台</a>
      </nav>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="site-footer">
    <div>{{ settings.shop_title if settings else '卡密商城' }} · 支付完成后自动发货</div>
    <div class="small" style="margin-top:6px;opacity:.75;">如遇问题请使用「联系客服」，或凭订单号 / 下单备注查询订单</div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
